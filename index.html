<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tab Master Pro - LemonTree Guitar</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
<style>
    :root {
        --font-main: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        
        --color-primary: #00f0ff;
        --color-primary-hover: #00c3ff;
        --color-secondary: #ff007f;
        --color-success: #00ff88;
        --color-error: #ff3366;
        --color-warning: #ffcc00;
        --color-text-light: #ffffff;
        --color-text-muted: #a0aabf;
        --color-text-dark: #0f172a;
        
        --guitar-neck: linear-gradient(180deg, #2c1e16 0%, #1a110c 100%);
        --guitar-head: #d4a373;
        --guitar-frets: #cbd5e1;
        --guitar-string: #f1f5f9;
        
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        --radius-lg: 16px;
        --radius-xl: 24px;
    }

    * { box-sizing: border-box; }

    body {
        font-family: var(--font-main);
        margin: 0;
        padding: 20px;
        user-select: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #1e003b, #4a00e0, #8e2de2, #ff007f);
        background-size: 300% 300%;
        animation: bgShift 15s ease infinite;
        overflow-x: hidden;
    }

    @keyframes bgShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

    .blob1 { position: fixed; top: 5%; left: 5%; width: 350px; height: 350px; background: #ff007f; border-radius: 50%; filter: blur(100px); z-index: -1; opacity: 0.6; animation: float 10s ease-in-out infinite alternate; }
    .blob2 { position: fixed; bottom: 5%; right: 10%; width: 450px; height: 450px; background: #00f0ff; border-radius: 50%; filter: blur(120px); z-index: -1; opacity: 0.5; animation: float 12s ease-in-out infinite alternate-reverse; }

    @keyframes float { 0% { transform: translate(0, 0); } 100% { transform: translate(30px, 50px); } }

    .glass-panel {
        background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.2); border-radius: var(--radius-xl); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }

    .game-container { width: 100%; max-width: 1400px; padding: 25px; display: flex; flex-direction: column; gap: 20px; color: var(--color-text-light); }

    .top-menu-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; padding: 15px 25px; gap: 20px; }
    .header-content h1 { margin: 0; font-size: 28px; font-weight: 900; letter-spacing: 1px; text-shadow: 0 2px 10px rgba(0,240,255,0.5); }
    .header-content .subtitle { margin: 4px 0 0 0; font-size: 12px; font-weight: 700; color: #e2e8f0; letter-spacing: 1px; }

    .controls-wrapper { display: flex; flex-wrap: wrap; gap: 15px; align-items: center; }
    .control-group { display: flex; align-items: center; gap: 8px; }
    .control-group label { font-size: 13px; font-weight: 700; color: #e2e8f0; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
    select { padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3); font-size: 14px; font-family: var(--font-main); font-weight: 600; background: rgba(0,0,0,0.4); color: white; outline: none; backdrop-filter: blur(5px); }
    select option { background: #1e293b; color: white; }

    .btn-primary { background: linear-gradient(90deg, #00f0ff, #ff007f); color: white; border: none; padding: 10px 24px; border-radius: 12px; font-size: 15px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 15px rgba(255,0,127,0.4); transition: transform 0.1s, box-shadow 0.2s; }
    .btn-primary:active { transform: scale(0.95); }
    .btn-primary:hover { box-shadow: 0 6px 20px rgba(0,240,255,0.6); }

    .score-area { display: flex; gap: 15px; align-items: center; }
    .score-card { background: rgba(0, 0, 0, 0.3); padding: 8px 20px; border-radius: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
    .score-label { font-size: 11px; font-weight: 700; color: #cbd5e1; display: block; margin-bottom: 2px; }
    .score-value { font-size: 22px; font-weight: 900; color: var(--color-warning); display: block; text-shadow: 0 0 10px rgba(255,204,0,0.5); }
    
    .btn-leaderboard { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 10px 15px; border-radius: 12px; font-size: 14px; font-weight: 800; cursor: pointer; backdrop-filter: blur(5px); transition: background 0.2s; }
    .btn-leaderboard:hover { background: rgba(255, 255, 255, 0.2); }

    .note-text-display { font-size: 20px; font-weight: 900; color: #ffffff; text-shadow: 0 0 15px rgba(0,240,255,0.8); text-align: center; padding: 15px; border-radius: var(--radius-lg); margin-top: -5px; }

    .white-paper { background: #ffffff !important; border-radius: var(--radius-lg); padding: 20px; box-shadow: inset 0 0 20px rgba(0,0,0,0.05); position: relative; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 0 10px; }
    .section-label { font-size: 15px; font-weight: 800; color: #e2e8f0; letter-spacing: 1px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
    .btn-outline { background: transparent; color: var(--color-primary); border: 2px solid var(--color-primary); padding: 6px 15px; border-radius: 8px; font-size: 13px; font-weight: 900; cursor: pointer; text-shadow: 0 0 5px rgba(0,0,0,0.8); transition: background 0.2s; }
    .btn-outline:hover { background: rgba(0, 240, 255, 0.1); }

    /* 오선 악보 */
    .staff-container { position: relative; height: 250px; display: flex; justify-content: center; padding-top: 60px; }
    .staff-lines-bg { position: relative; width: 100%; max-width: 800px; height: 60px; }
    .staff-line { position: absolute; height: 2px; background-color: var(--color-text-dark); width: 100%; left: 0; }
    .clef { position: absolute; left: -30px; top: -15px; font-size: 75px; font-family: serif; color: var(--color-text-dark); }
    
    .chord-name-display { position: absolute; font-size: 22px; font-weight: 900; color: var(--color-primary); text-shadow: 0 0 8px rgba(0,240,255,0.4); z-index: 10; pointer-events: none; }
    .staff-chord-name { top: -45px; left: 0px; }
    .tab-chord-name { top: -35px; left: 0px; color: var(--color-secondary); text-shadow: 0 0 8px rgba(255,0,127,0.4); }

    .note-wrapper { position: absolute; z-index: 5; transition: opacity 0.3s; transform: translateX(-50%); }
    .note-head { position: absolute; width: 18px; height: 14px; background-color: var(--color-text-dark); border-radius: 50%; transform: rotate(-15deg); left: -9px; top: -7px; }
    .accidental { position: absolute; left: -22px; top: -10px; font-size: 18px; font-weight: bold; font-family: serif; color: var(--color-text-dark); }
    .string-indicator { position: absolute; left: 14px; top: -14px; font-size: 15px; font-weight: 900; color: #d97706; }
    .ledger-line { position: absolute; transform: translateX(-50%); width: 34px; height: 2px; background-color: var(--color-text-dark); z-index: 1; }
    
    .note-wrapper.solved .note-head, .note-wrapper.solved .accidental { background-color: #10b981; color: #10b981; }
    .note-wrapper.playing .note-head { background-color: #f59e0b; box-shadow: 0 0 15px #f59e0b; }

    .particle { position: absolute; width: 8px; height: 8px; border-radius: 50%; pointer-events: none; z-index: 20; animation: shatter 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }
    @keyframes shatter { 0% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } 100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0); opacity: 0; } }

    /* 타브 악보 */
    #tab-wrapper { transition: max-height 0.3s ease, opacity 0.3s ease; max-height: 300px; opacity: 1; overflow: hidden; }
    #tab-wrapper.hidden { max-height: 0; opacity: 0; margin-bottom: 0; border: none; padding: 0; }
    
    .tab-container { position: relative; height: 160px; display: flex; flex-direction: column; justify-content: center; padding: 0 30px; }
    .tab-lines-bg { position: relative; height: 130px; display: flex; flex-direction: column; justify-content: space-between; max-width: 800px; margin: 0 auto; width: 100%; }
    .tab-line { height: 1.5px; background-color: #64748b; width: 100%; }
    .tab-line::before { content: attr(data-string); position: absolute; left: -20px; font-size: 14px; font-weight: 800; color: #334155; margin-top: -8px; }
    .tab-numbers-area { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .tab-number { position: absolute; transform: translate(-50%, -50%); background: #ffffff; padding: 0 6px; font-size: 18px; font-weight: 900; border-radius: 4px; z-index: 10; box-shadow: 0 0 0 3px #ffffff; color: var(--color-text-dark); transition: color 0.2s; }

    /* 대형 기타 지판 */
    .guitar-area-wrapper { width: 100%; overflow-x: auto; padding-bottom: 15px; -webkit-overflow-scrolling: touch; background: rgba(0,0,0,0.5); border-radius: var(--radius-lg); padding: 20px; border: 1px solid rgba(255,255,255,0.1); }
    .guitar-area-wrapper::-webkit-scrollbar { height: 12px; }
    .guitar-area-wrapper::-webkit-scrollbar-thumb { background: linear-gradient(90deg, #00f0ff, #ff007f); border-radius: 6px; }

    .guitar-area { display: flex; flex-direction: column; min-width: 1260px; }
    .open-string-label { position: relative; left: 100px; width: 60px; text-align: center; font-size: 14px; font-weight: 800; color: #e2e8f0; margin-bottom: 8px; }
    .guitar-container { display: flex; align-items: center; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.6); border-radius: 12px; }

    .headstock { width: 100px; height: 234px; background-color: var(--guitar-head); border-radius: 12px 0 0 12px; border: 2px solid #b48554; position: relative; z-index: 2; flex-shrink: 0; }
    .nut { width: 10px; height: 234px; background: #f8fafc; border-right: 3px solid #94a3b8; border-left: 2px solid #cbd5e1; z-index: 3; flex-shrink: 0; }
    
    .peg { position: absolute; width: 14px; height: 24px; background: linear-gradient(to right, #f8fafc, #cbd5e1); border: 1px solid #94a3b8; }
    .peg.top { top: -20px; border-radius: 4px 4px 0 0; } .peg.bottom { bottom: -20px; border-radius: 0 0 4px 4px; }
    .peg-1 { left: 15px; } .peg-2 { left: 45px; } .peg-3 { left: 75px; }
    .post { position: absolute; width: 10px; height: 10px; background: #94a3b8; border-radius: 50%; top: 50%; transform: translateY(-50%); }
    .post-t1 { left: 17px; top: 25%; } .post-t2 { left: 47px; top: 25%; } .post-t3 { left: 77px; top: 25%; }
    .post-b1 { left: 17px; top: 75%; } .post-b2 { left: 47px; top: 75%; } .post-b3 { left: 77px; top: 75%; }

    .fretboard { display: flex; height: 234px; flex-grow: 1; background: var(--guitar-neck); border-top: 3px solid #000; border-bottom: 3px solid #000; position: relative; border-radius: 0 8px 8px 0; overflow: hidden; }
    .fret-column { flex: 1; border-right: 4px solid var(--guitar-frets); display: flex; flex-direction: column; position: relative; }
    .fret-column:last-child { border-right: none; }
    
    .fret-column:nth-child(4)::after, .fret-column:nth-child(6)::after, .fret-column:nth-child(8)::after, .fret-column:nth-child(10)::after, .fret-column:nth-child(16)::after {
        content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 18px; height: 18px; background-color: rgba(255,255,255,0.8); border-radius: 50%; pointer-events: none; z-index: 1; box-shadow: inset 1px 1px 3px rgba(0,0,0,0.5);
    }
    .fret-column:nth-child(13)::before, .fret-column:nth-child(13)::after {
        content: ''; position: absolute; left: 50%; transform: translateX(-50%); width: 14px; height: 14px; background-color: rgba(255,255,255,0.8); border-radius: 50%; pointer-events: none; z-index: 1; box-shadow: inset 1px 1px 3px rgba(0,0,0,0.5);
    }
    .fret-column:nth-child(13)::before { top: 25%; } .fret-column:nth-child(13)::after { bottom: 25%; }
    
    .fret-column.fret-0 { flex: 0.3; background-color: rgba(255,255,255,0.03); border-right: 2px solid rgba(255,255,255,0.1); }
    .fret-column.fret-0::after { display: none; }

    .string-cell { flex: 1; position: relative; cursor: pointer; z-index: 5; display: flex; align-items: center; justify-content: center; transition: background 0.1s; }
    .string-cell:hover { background-color: rgba(0, 240, 255, 0.15); }
    .open-number { position: absolute; color: rgba(255,255,255,0.6); font-weight: bold; font-size: 16px; pointer-events: none; }

    .visual-string { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); background-color: var(--guitar-string); pointer-events: none; box-shadow: 0 3px 6px rgba(0,0,0,0.9); z-index: 2; }
    .visual-string-1 { height: 1.5px; } .visual-string-2 { height: 2px; } .visual-string-3 { height: 2.5px; }
    .visual-string-4 { height: 3.5px; background: repeating-linear-gradient(90deg, #e2e8f0, #e2e8f0 3px, #94a3b8 3px, #94a3b8 6px); }
    .visual-string-5 { height: 4.5px; background: repeating-linear-gradient(90deg, #e2e8f0, #e2e8f0 3px, #94a3b8 3px, #94a3b8 6px); }
    .visual-string-6 { height: 6px; background: repeating-linear-gradient(90deg, #e2e8f0, #e2e8f0 3px, #94a3b8 3px, #94a3b8 6px); }

    .realistic-finger { position: absolute; width: 36px; background: linear-gradient(to right, #f6d3a8, #e5b078, #f6d3a8); border-radius: 18px 18px 45% 45%; box-shadow: 3px 8px 20px rgba(0,0,0,0.8); z-index: 100; transform-origin: top center; animation: dropFinger 0.15s ease-out forwards; }
    .realistic-nail { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); width: 20px; height: 22px; background: #fae6ce; border-radius: 50% 50% 40% 40%; border: 1px solid #d49f57; box-shadow: inset 0 -2px 3px rgba(0,0,0,0.1); }
    .finger-joint { position: absolute; width: 60%; height: 3px; background: rgba(166, 107, 44, 0.4); left: 20%; border-radius: 50%; bottom: 40px; }
    .finger-joint:nth-child(2) { bottom: 48px; width: 50%; left: 25%; }

    .answer-marker { position: absolute; width: 24px; height: 24px; background-color: rgba(255, 0, 127, 0.9); border: 3px solid #ff007f; border-radius: 50%; z-index: 20; pointer-events: none; box-shadow: 0 0 20px rgba(255, 0, 127, 0.8); animation: pulse 1s infinite; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(8px); }
    .modal-content { background: rgba(15, 23, 42, 0.85); width: 90%; max-width: 450px; border-radius: var(--radius-xl); border: 1px solid rgba(0,240,255,0.3); padding: 25px; display: flex; flex-direction: column; max-height: 80vh; color: white; box-shadow: 0 0 30px rgba(0,240,255,0.2); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-header h2 { margin: 0; font-size: 22px; color: var(--color-primary); }
    .btn-close { background: transparent; border: none; font-size: 28px; cursor: pointer; color: white; }
    
    .leaderboard-list { overflow-y: auto; flex-grow: 1; padding-right: 5px; }
    .leaderboard-list::-webkit-scrollbar { width: 6px; }
    .leaderboard-list::-webkit-scrollbar-thumb { background: var(--color-primary); border-radius: 3px; }
    .lb-row { display: flex; justify-content: space-between; padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 14px; }
    .lb-row.header { font-weight: 900; color: var(--color-secondary); border-bottom: 2px solid rgba(255,255,255,0.3); }
    .lb-row.my-row { background: rgba(0,240,255,0.15); font-weight: 900; color: var(--color-primary); border-radius: 8px; }

    .db-warning { display: none; }
</style>
</head>
<body>

<div class="blob1"></div>
<div class="blob2"></div>

<div class="game-container glass-panel">
    
    <div class="top-menu-bar glass-panel">
        <div class="header-content">
            <h1>Tab Master Pro</h1>
            <p class="subtitle">LemonTree Guitar Academy</p>
        </div>
        
        <div class="controls-wrapper">
            <div class="control-group">
                <label>모드</label>
                <select id="opt-mode">
                    <option value="1">멜로디 (단음)</option>
                    <option value="2">2화음 (파워코드)</option>
                    <option value="3">3화음 (트라이어드)</option>
                    <option value="4">4화음 (기본/7th)</option>
                    <option value="5">5화음 (오픈/바레)</option>
                    <option value="6">6화음 (풀 스트럼)</option>
                </select>
            </div>
            <div class="control-group">
                <label>프렛</label>
                <select id="opt-range">
                    <option value="0-4">0~4 (로우)</option>
                    <option value="5-9">5~9 (미들)</option>
                    <option value="10-15">10~15 (하이)</option>
                    <option value="0-15" selected>전체 프렛</option>
                </select>
            </div>
            <button id="btn-start" class="btn-primary">시작하기 🎸</button>
        </div>

        <div class="score-area">
            <div class="score-card">
                <span class="score-label">누적 점수</span>
                <span class="score-value" id="cumulative-score">0</span>
            </div>
            <button class="btn-leaderboard" onclick="openLeaderboard()">🏆 랭킹</button>
        </div>
    </div>

    <div class="note-text-display glass-panel" id="note-text">옵션을 선택하고 시작 버튼을 누르세요!</div>

    <div>
        <div class="section-header">
            <span class="section-label">오선 악보 (Standard Notation)</span>
        </div>
        <div class="staff-container white-paper">
            <div class="staff-lines-bg" id="staff-lines-bg">
                <div class="staff-line" style="top: 0px;"></div>
                <div class="staff-line" style="top: 15px;"></div>
                <div class="staff-line" style="top: 30px;"></div>
                <div class="staff-line" style="top: 45px;"></div>
                <div class="staff-line" style="top: 60px;"></div>
                <div class="clef">&#119070;</div>
                <div id="staff-notes-area"></div>
            </div>
        </div>
    </div>

    <div id="tab-module">
        <div class="section-header">
            <span class="section-label">타브 악보 (TAB)</span>
            <button id="btn-toggle-tab" class="btn-outline">타브 악보 숨기기</button>
        </div>
        <div id="tab-wrapper" class="white-paper">
            <div class="tab-container" id="tab-container">
                <div class="tab-lines-bg">
                    <div class="tab-line" data-string="e"></div>
                    <div class="tab-line" data-string="B"></div>
                    <div class="tab-line" data-string="G"></div>
                    <div class="tab-line" data-string="D"></div>
                    <div class="tab-line" data-string="A"></div>
                    <div class="tab-line" data-string="E"></div>
                    <div class="tab-numbers-area" id="tab-numbers-area"></div>
                </div>
            </div>
        </div>
    </div>

    <div>
        <div class="section-header">
            <span class="section-label">프렛보드 (클릭하여 연주)</span>
        </div>
        <div class="guitar-area-wrapper">
            <div class="guitar-area">
                <div class="open-string-label">개방현</div>
                <div class="guitar-container">
                    <div class="headstock">
                        <div class="peg top peg-1"></div><div class="peg top peg-2"></div><div class="peg top peg-3"></div>
                        <div class="peg bottom peg-1"></div><div class="peg bottom peg-2"></div><div class="peg bottom peg-3"></div>
                        <div class="post post-t1"></div><div class="post post-t2"></div><div class="post post-t3"></div>
                        <div class="post post-b1"></div><div class="post post-b2"></div><div class="post post-b3"></div>
                    </div>
                    <div class="nut"></div>
                    <div class="fretboard" id="fretboard"></div>
                </div>
            </div>
        </div>
    </div>

</div>

<div class="modal-overlay" id="leaderboard-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>🏆 명예의 전당</h2>
            <button class="btn-close" onclick="closeLeaderboard()">&times;</button>
        </div>
        <div class="leaderboard-list">
            <div class="lb-row header">
                <span style="width:40px; text-align:center;">순위</span>
                <span style="flex-grow:1; text-align:center;">달성 일시</span>
                <span style="width:60px; text-align:right;">점수</span>
            </div>
            <div id="lb-content"></div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // === Web Audio API ===
    let audioCtx = null;
    function initAudio() {
        try {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (AudioContextClass && !audioCtx) audioCtx = new AudioContextClass();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        } catch(e) { console.warn(e); }
    }
    
    function playGuitarSound(midi) {
        initAudio();
        if(!audioCtx) return;
        const freq = 440 * Math.pow(2, (midi - 69) / 12);
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(1.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.0);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 2.0);
    }

    function getNoteInfo(midi) {
        const noteIndex = midi % 12;
        const noteName = noteNames[noteIndex];
        const baseLetter = noteName[0];
        const isSharp = noteName.includes('#');
        const guitarOctave = Math.floor(midi / 12) - 1;
        const notationOctave = guitarOctave + 1;
        const step = stepBase[baseLetter] + (notationOctave - 4) * 7;
        const y = 75 - (step * 7.5);
        return { midi, noteName, isSharp, y, fullName: `${noteName}${notationOctave}` };
    }

    function startNewProblem() {
        if(isProcessing) return;
        clearFingers();
        clearMarkers();
        noteTextEl.style.color = '#ffffff';
        noteTextEl.style.textShadow = '0 0 15px rgba(0,240,255,0.8)';
        
        const mode = parseInt(document.getElementById('opt-mode').value);
        isMelodyMode = (mode === 1);
        melodyStepIndex = 0;
        currentProblemNameStr = "";

        const range = document.getElementById('opt-range').value.split('-').map(Number);
        let targets = [];
        let problemTitle = "";

        if (isMelodyMode) {
            const noteCount = Math.floor(Math.random() * 7) + 2; 
            for (let i = 0; i < noteCount; i++) {
                let randMidi;
                let bestPos = null;
                let attemptsInner = 0;
                while(!bestPos && attemptsInner < 100) {
                    attemptsInner++;
                    randMidi = C_MAJOR_SCALE_PITCHES[Math.floor(Math.random() * C_MAJOR_SCALE_PITCHES.length)];
                    for (let s = 1; s <= 6; s++) {
                        let f = randMidi - stringBaseMidi[s];
                        if (f >= range[0] && f <= range[1]) { bestPos = { s, f }; break; }
                    }
                    if(range[0] === 0 && !bestPos) { 
                         for (let s = 1; s <= 6; s++) {
                            let f = randMidi - stringBaseMidi[s];
                            if (f >= 0 && f <= 5) { bestPos = { s, f }; break; }
                        }
                    }
                }
                if (!bestPos) bestPos = {s: 1, f: 0}; 
                targets.push({ string: bestPos.s, fret: bestPos.f, info: getNoteInfo(randMidi), solved: false, isStrictString: false });
            }
            problemTitle = `멜로디 연습 (${noteCount}음)`;
            currentProblemPoints = noteCount * 10;
        } else {
            let possibleChords = REAL_CHORDS.filter(c => {
                if(c.notes.length < mode) return false;
                return c.notes.slice(0, mode).every(n => (n.f === 0 && range[0] === 0) || (n.f >= range[0] && n.f <= range[1]));
            });
            
            // 💡 전체 프렛(0~15) 설정 시 로우/미들/하이 포지션을 강제로 균등하게(33%) 출제
            if (range[0] === 0 && range[1] === 15 && possibleChords.length > 0) {
                const zone = Math.floor(Math.random() * 3); // 0:로우, 1:미들, 2:하이
                const zoneChords = possibleChords.filter(c => {
                    // 선택된 모드 갯수만큼의 노트를 기준으로 가장 높은 프렛 계산
                    const maxFret = Math.max(...c.notes.slice(0, mode).map(n => n.f));
                    if (zone === 0) return maxFret <= 4;
                    if (zone === 1) return maxFret >= 5 && maxFret <= 9;
                    if (zone === 2) return maxFret >= 10;
                });
                // 만약 해당 존에 맞는 코드가 없으면 필터링 무시
                if (zoneChords.length > 0) possibleChords = zoneChords;
            }
            
            if(possibleChords.length === 0) possibleChords = REAL_CHORDS.filter(c => c.notes.length >= mode);
            if(possibleChords.length === 0) possibleChords = REAL_CHORDS; 

            const selectedChord = possibleChords[Math.floor(Math.random() * possibleChords.length)];
            const sortedNotes = [...selectedChord.notes].sort((a, b) => b.s - a.s); 
            const notesToUse = sortedNotes.slice(0, mode);

            targets = notesToUse.map(n => {
                const isStrict = (n.f >= 4); 
                return { string: n.s, fret: n.f, info: getNoteInfo(stringBaseMidi[n.s] + n.f), solved: false, isStrictString: isStrict };
            });
            
            // 💡 3화음 이하일 때는 혼동 방지를 위해 코드명 표시 안함
            if (mode <= 3) {
                problemTitle = `코드 연주 (${mode}음)`;
                currentProblemNameStr = ""; 
            } else {
                problemTitle = `${selectedChord.name}`;
                currentProblemNameStr = selectedChord.name;
            }
            
            let baseScore = mode * 15;
            if(range[0] >= 5 || (range[0] === 0 && Math.max(...notesToUse.map(n=>n.f)) >= 5)) baseScore *= 1.5; 
            currentProblemPoints = Math.floor(baseScore * (isTabHidden ? 2 : 1));
        }

        currentProblem = targets;
        if(!isMelodyMode) currentProblem.sort((a, b) => b.info.y - a.info.y);
        renderProblem();
        noteTextEl.textContent = `목표: ${problemTitle} (+${currentProblemPoints}점)`;
    }

    function renderProblem() {
        staffNotesAreaEl.innerHTML = '';
        tabNumbersAreaEl.innerHTML = '';

        if (!isMelodyMode && currentProblemNameStr !== "") {
            staffNotesAreaEl.innerHTML += `<div class="chord-name-display staff-chord-name">${currentProblemNameStr}</div>`;
            tabNumbersAreaEl.innerHTML += `<div class="chord-name-display tab-chord-name">${currentProblemNameStr}</div>`;
        }
        
        currentProblem.forEach((target, index) => {
            const y = target.info.y;
            let hPos = '50%';
            if (isMelodyMode) {
                const spacing = 80 / currentProblem.length;
                hPos = `calc(10% + ${index * spacing}%)`;
            }

            let ledgerHtml = '';
            if (y >= 75) {
                for (let l = 75; l <= y + 1; l += 15) { ledgerHtml += `<div class="ledger-line" style="top: ${l}px; left: ${hPos};"></div>`; }
            }
            if (y <= -15) {
                for (let l = -15; l >= y - 1; l -= 15) { ledgerHtml += `<div class="ledger-line" style="top: ${l}px; left: ${hPos};"></div>`; }
            }

            let stringNumHtml = '';
            if (isTabHidden && target.isStrictString && !isMelodyMode) {
                stringNumHtml = `<div class="string-indicator">${stringCircles[target.string]}</div>`;
            }

            let noteHtml = `
                ${ledgerHtml}
                <div class="note-wrapper ${index === melodyStepIndex && isMelodyMode ? 'playing' : ''}" id="note-${index}" style="top: ${y}px; left: ${hPos};">
                    <div class="note-head"></div>
                    ${target.info.isSharp ? `<div class="accidental">#</div>` : ''}
                    ${stringNumHtml}
                </div>
            `;
            staffNotesAreaEl.innerHTML += noteHtml;

            const tabY = (target.string - 1) * 26;
            let tabHtml = `<div class="tab-number" id="tab-${index}" style="top: ${tabY}px; left: ${hPos};">${target.fret}</div>`;
            tabNumbersAreaEl.innerHTML += tabHtml;
        });
    }

    function handleFretClick(s, f, cellElement) {
        if (currentProblem.length === 0 || isProcessing) return;

        const clickedMidi = stringBaseMidi[s] + f;
        playGuitarSound(clickedMidi); 
        drawRealisticFinger(cellElement, s);

        let isCorrect = false;
        let targetIndex = -1;

        if (isMelodyMode) {
            const targetNote = currentProblem[melodyStepIndex];
            if (isTabHidden) isCorrect = (targetNote.info.midi === clickedMidi);
            else isCorrect = (targetNote.string === s && targetNote.fret === f);
            if (isCorrect) targetIndex = melodyStepIndex;
        } else {
            targetIndex = currentProblem.findIndex(t => {
                if (t.solved) return false;
                if (isTabHidden) {
                    if (t.isStrictString) return t.string === s && t.fret === f;
                    else return t.info.midi === clickedMidi; 
                }
                return t.string === s && t.fret === f; 
            });
            if (targetIndex !== -1) isCorrect = true;
        }

        if (isCorrect) {
            currentProblem[targetIndex].solved = true;
            
            // 💡 단음/화음 모드 상관없이 맞추는 즉시 개별 타격 파괴 효과!
            shatterElement(targetIndex);

            if (isMelodyMode) {
                melodyStepIndex++;
                if (melodyStepIndex < currentProblem.length) {
                    document.getElementById(`note-${melodyStepIndex}`).classList.add('playing');
                }
            }
            
            if (currentProblem.every(t => t.solved)) {
                isProcessing = true;
                noteTextEl.textContent = `PERFECT! 🎉 (+${currentProblemPoints}점)`;
                noteTextEl.style.color = "var(--color-success)";
                noteTextEl.style.textShadow = "0 0 15px rgba(0,255,136,0.8)";
                addCumulativeScore(currentProblemPoints);
                
                setTimeout(() => {
                    isProcessing = false;
                    startNewProblem();
                }, 1000);
            }

        } else {
            isProcessing = true;
            noteTextEl.textContent = "Miss! 😅 멘탈 잡고 다시 도전!";
            noteTextEl.style.color = "var(--color-error)";
            noteTextEl.style.textShadow = "0 0 15px rgba(255,51,102,0.8)";
            showAnswerMarkers(isTabHidden);

            setTimeout(() => {
                isProcessing = false;
                startNewProblem();
            }, 2000);
        }
    }

    function showAnswerMarkers(isHiddenMode) {
        currentProblem.forEach(target => {
            if (isHiddenMode && !target.isStrictString) {
                const targetMidi = target.info.midi;
                for (let str = 1; str <= 6; str++) {
                    for (let frt = 0; frt <= TOTAL_FRETS; frt++) {
                        if (stringBaseMidi[str] + frt === targetMidi) drawMarkerAt(str, frt);
                    }
                }
            } else {
                drawMarkerAt(target.string, target.fret);
            }
        });
    }

    function drawMarkerAt(s, f) {
        const cell = document.querySelector(`.string-cell[data-string="${s}"][data-fret="${f}"]`);
        if (cell && !cell.querySelector('.answer-marker')) {
            const marker = document.createElement('div');
            marker.className = 'answer-marker';
            cell.appendChild(marker);
        }
    }

    function drawRealisticFinger(cellElement, stringNum) {
        const finger = document.createElement('div');
        finger.className = 'realistic-finger';
        finger.innerHTML = `<div class="finger-joint"></div><div class="finger-joint"></div><div class="realistic-nail"></div>`;
        const fretboardRect = fretboardEl.getBoundingClientRect();
        const cellRect = cellElement.getBoundingClientRect();
        const relativeX = (cellRect.left - fretboardRect.left) + (cellRect.width / 2);
        const targetY = (cellRect.top - fretboardRect.top) + (cellRect.height / 2);
        const startY = -40; 
        const fingerHeight = targetY - startY + 12; 
        finger.style.left = `${relativeX - 18}px`; 
        finger.style.top = `${startY}px`;
        finger.style.height = `${fingerHeight}px`;
        fretboardEl.appendChild(finger);
        setTimeout(() => { if (finger.parentNode === fretboardEl) finger.remove(); }, 300);
    }

    function clearFingers() { document.querySelectorAll('.realistic-finger').forEach(f => f.remove()); }
    function clearMarkers() { document.querySelectorAll('.answer-marker').forEach(m => m.remove()); }

    initFretboard();
    initFirebase();
</script>
</body>
</html>
